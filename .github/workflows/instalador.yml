# Compila o instalador .exe numa máquina Windows do GitHub.
# Roda a cada push e quando você clica em "Run workflow" na aba Actions.
# Ao criar uma tag (ex.: v2.3), o .exe também é publicado em Releases.
# Na branch main, também atualiza o atualizacao.json (atualização online dos apps).
name: Instalador Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Atualizar atualizacao.json
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          python gerar_atualizacao.py
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add atualizacao.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m "atualizacao.json" ; git push }

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Compilar
        shell: pwsh
        env:
          CI: "1"
        run: ./build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: EspelhoHex-Simulador-Setup
          path: saida/*.exe

      - name: Publicar na Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: saida/*.exe
