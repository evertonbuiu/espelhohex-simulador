# Compila o instalador .exe numa máquina Windows do GitHub.
# Roda a cada push e quando você clica em "Run workflow" na aba Actions.
# Na branch main: atualiza o atualizacao.json (atualização online dos apps) e
# publica o .exe em Releases, com a tag v<APP_VERSION> de app/simulador.py.
name: Instalador Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Atualizar atualizacao.json
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          python gerar_atualizacao.py
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add atualizacao.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m "atualizacao.json" ; git push }

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Compilar
        shell: pwsh
        env:
          CI: "1"
        run: ./build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: EspelhoHex-Simulador-Setup
          path: saida/*.exe

      - name: Versão do app
        id: versao
        shell: pwsh
        run: |
          $v = (Select-String -Path app/simulador.py -Pattern '^APP_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "versao=$v" >> $env:GITHUB_OUTPUT

      - name: Publicar na Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.versao }}
          name: EspelhoHex Simulador ${{ steps.versao.outputs.versao }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          body: |
            Instalador para Windows 10/11 (64 bits). Baixe o .exe abaixo e execute.
            Quem já tem o app instalado recebe esta versão sozinho pela atualização online.
          files: saida/*.exe
